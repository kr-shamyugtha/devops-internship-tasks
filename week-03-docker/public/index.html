<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brew Haven Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>☕ Brew Haven Cafe</h1>
        <p>Fresh Food • Great Coffee • Cozy Vibes</p>
    </header>

    <div class="menu-buttons">
        <button onclick="loadMenu('starters')">Starters</button>
        <button onclick="loadMenu('soups')">Soups</button>
        <button onclick="loadMenu('salads')">Salads</button>
        <button onclick="loadMenu('maincourse')">Main Course</button>
        <button onclick="loadMenu('sides')">Sides</button>
        <button onclick="loadMenu('desserts')">Desserts</button>
        <button onclick="loadMenu('drinks')">Drinks</button>
    </div>

    <div id="menu-container">
        <h2>Welcome to Brew Haven</h2>
        <p>Select a category above to explore our menu.</p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
